name: Build Docmost Fixed (Docker Hub)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Docmost version tag, e.g. v0.95.0'
        required: true
        default: 'v0.95.0'
      tag_suffix:
        description: 'Image tag suffix'
        required: false
        default: 'fixed'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Docmost source
        uses: actions/checkout@v4
        with:
          repository: docmost/docmost
          ref: ${{ inputs.version }}
          persist-credentials: false
          submodules: recursive

      - name: Apply zip attachment path fix
        run: |
          sed -i 's|`/files/${attachment.id}/${attachment.fileName}`|`files/${attachment.id}/${attachment.fileName}`|' \
            apps/server/src/integrations/export/export.service.ts
          grep -n 'const filePath' apps/server/src/integrations/export/export.service.ts

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: docker.io/${{ vars.DOCKERHUB_USERNAME }}/docmost:${{ inputs.tag_suffix }}-${{ inputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
